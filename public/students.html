<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Students - College E-Voting</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #5a5a5a;
  min-height: 100vh;
  padding: 40px 20px;
}

body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
  z-index: -2;
  animation: gradientShift 8s ease infinite;
}

@keyframes gradientShift {
  0%, 100% { background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%); }
  50% { background: linear-gradient(135deg, #764ba2 0%, #f093fb 50%, #667eea 100%); }
}

body::after {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
              radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
  z-index: -1;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 40px;
  padding-bottom: 30px;
  border-bottom: 2px solid rgba(255, 255, 255, 0.2);
}

.header h1 {
  font-size: 32px;
  font-weight: 700;
  color: white;
  letter-spacing: -0.5px;
}

.back-btn {
  padding: 12px 28px;
  background: rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(10px);
  color: white;
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  text-decoration: none;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
  display: inline-block;
}

.back-btn:hover {
  background: rgba(255, 255, 255, 0.3);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
}

/* Search Section */
.search-section {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(20px);
  padding: 24px 32px;
  border-radius: 18px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.5);
  margin-bottom: 30px;
  display: flex;
  align-items: center;
  gap: 16px;
}

.search-section input {
  flex: 1;
  padding: 14px 18px;
  border: 1.5px solid #e0d5c7;
  border-radius: 10px;
  font-size: 15px;
  font-family: 'Inter', sans-serif;
  background: #fdfcfb;
  transition: all 0.3s ease;
  color: #5a5a5a;
}

.search-section input:focus {
  outline: none;
  border-color: #667eea;
  background: white;
  box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

.search-section input::placeholder {
  color: #999;
}

.search-icon {
  font-size: 20px;
  color: #667eea;
}

/* Stats */
.stats {
  display: flex;
  gap: 20px;
  margin-bottom: 30px;
  flex-wrap: wrap;
}

.stat-card {
  flex: 1;
  min-width: 200px;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(20px);
  padding: 24px;
  border-radius: 18px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.5);
  text-align: center;
}

.stat-number {
  font-size: 36px;
  font-weight: 700;
  color: #667eea;
  margin-bottom: 8px;
}

.stat-label {
  font-size: 14px;
  color: #999;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Students Table */
.students-container {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(20px);
  padding: 32px;
  border-radius: 18px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.5);
}

.students-container h2 {
  color: #667eea;
  font-size: 24px;
  margin-bottom: 24px;
  font-weight: 700;
}

.students-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
}

.students-table thead {
  background: rgba(102, 126, 234, 0.1);
  border-radius: 10px;
}

.students-table th {
  padding: 16px 20px;
  text-align: left;
  font-weight: 700;
  color: #667eea;
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 2px solid rgba(102, 126, 234, 0.2);
}

.students-table td {
  padding: 16px 20px;
  border-bottom: 1px solid rgba(102, 126, 234, 0.1);
  font-size: 14px;
  color: #5a5a5a;
}

.students-table tbody tr {
  transition: all 0.2s ease;
}

.students-table tbody tr:hover {
  background: rgba(102, 126, 234, 0.05);
}

.status-badge {
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.status-voted {
  background: rgba(76, 175, 80, 0.15);
  color: #4caf50;
  border: 1px solid rgba(76, 175, 80, 0.3);
}

.status-pending {
  background: rgba(255, 152, 0, 0.15);
  color: #ff9800;
  border: 1px solid rgba(255, 152, 0, 0.3);
}

.delete-btn {
  background: linear-gradient(135deg, #ff6b6b 0%, #ff5252 100%);
  color: white;
  border: none;
  border-radius: 6px;
  padding: 8px 16px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 2px 8px rgba(255, 107, 107, 0.2);
}

.delete-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
}

.no-results {
  text-align: center;
  padding: 60px 20px;
  color: #999;
  font-size: 16px;
}

.no-results-icon {
  font-size: 48px;
  margin-bottom: 16px;
  opacity: 0.5;
}

/* Loading */
.loading {
  text-align: center;
  padding: 60px 20px;
  color: #667eea;
  font-size: 16px;
  font-weight: 600;
}

/* Responsive */
@media (max-width: 768px) {
  .header {
    flex-direction: column;
    gap: 20px;
    align-items: flex-start;
  }

  .header h1 {
    font-size: 24px;
  }

  .search-section {
    flex-direction: column;
  }

  .stats {
    flex-direction: column;
  }

  .students-table {
    font-size: 12px;
  }

  .students-table th,
  .students-table td {
    padding: 12px 10px;
  }

  .students-container {
    padding: 20px;
    overflow-x: auto;
  }
}
</style>
</head>

<body>
<div class="container">

  <div class="header">
    <h1>👥 All Students</h1>
    <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>
  </div>

  <!-- Search Section -->
  <div class="search-section">
    <span class="search-icon">🔍</span>
    <input 
      type="text" 
      id="searchInput" 
      placeholder="Search by admission number, email, or name..."
      autocomplete="off"
    >
  </div>

  <!-- Statistics -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-number" id="totalStudents">0</div>
      <div class="stat-label">Total Students</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="votedCount">0</div>
      <div class="stat-label">Voted</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="pendingCount">0</div>
      <div class="stat-label">Pending</div>
    </div>
  </div>

  <!-- Students Table -->
  <div class="students-container">
    <h2>Student Records</h2>
    
    <div id="loadingDiv" class="loading">
      Loading students...
    </div>

    <table class="students-table" id="studentsTable" style="display: none;">
      <thead>
        <tr>
          <th>Admission No</th>
          <th>Email</th>
          <th>Voting Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="studentsTableBody">
      </tbody>
    </table>

    <div id="noResults" class="no-results" style="display: none;">
      <div class="no-results-icon">🔍</div>
      <p>No students found matching your search.</p>
    </div>
  </div>

</div>

<script type="module" src="./js/students.js"></script>
</body>
</html>

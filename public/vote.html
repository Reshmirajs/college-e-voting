<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vote - College E-Voting</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #333;
  min-height: 100vh;
}

body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
  z-index: -2;
  animation: gradientShift 8s ease infinite;
}

@keyframes gradientShift {
  0%, 100% { background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%); }
  50% { background: linear-gradient(135deg, #764ba2 0%, #f093fb 50%, #667eea 100%); }
}

/* Header */
.header {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(20px);
  padding: 24px 30px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
  border-bottom: 1px solid rgba(255, 255, 255, 0.5);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-weight: 700;
  font-size: 20px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.student-info {
  text-align: right;
  font-size: 14px;
  color: #666;
  font-weight: 500;
}

.student-name {
  display: block;
  color: #333;
  font-weight: 600;
  margin-bottom: 4px;
}

/* Main */
.main {
  max-width: 900px;
  margin: 40px auto;
  padding: 0 20px;
}

.page-title {
  color: white;
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 30px;
  text-align: center;
}

.position-card {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(20px);
  border-radius: 18px;
  padding: 28px;
  margin-bottom: 25px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.5);
  animation: slideIn 0.6s ease;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.position-title {
  font-size: 18px;
  font-weight: 700;
  color: #667eea;
  margin-bottom: 18px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.candidate {
  display: flex;
  align-items: center;
  padding: 14px;
  background: rgba(102, 126, 234, 0.05);
  border-radius: 10px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: all 0.2s ease;
  border: 2px solid transparent;
}

.candidate:hover {
  background: rgba(102, 126, 234, 0.12);
  border-color: #667eea;
}

.candidate input[type="radio"] {
  width: 20px;
  height: 20px;
  margin-right: 14px;
  cursor: pointer;
  accent-color: #667eea;
}

.candidate-info {
  flex: 1;
}

.candidate-name {
  font-weight: 600;
  color: #333;
  margin-bottom: 4px;
}

.candidate-details {
  font-size: 13px;
  color: #999;
}

/* Message */
#statusMsg {
  text-align: center;
  padding: 14px 16px;
  border-radius: 12px;
  margin-bottom: 20px;
  font-weight: 500;
  animation: slideDown 0.3s ease;
  display: none;
}

#statusMsg.show {
  display: block;
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.error {
  background: rgba(255, 107, 107, 0.1);
  color: #ff6b6b;
  border: 1px solid rgba(255, 107, 107, 0.3);
}

.success {
  background: rgba(76, 175, 80, 0.1);
  color: #4caf50;
  border: 1px solid rgba(76, 175, 80, 0.3);
}

/* Button */
button {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  border: none;
  border-radius: 12px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 20px;
  transition: all 0.3s ease;
  color: white;
  font-size: 15px;
  box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
}

button:active {
  transform: translateY(0);
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

#logoutBtn {
  display: none;
  margin-top: 12px;
  background: linear-gradient(135deg, #999 0%, #666 100%);
  box-shadow: 0 10px 25px rgba(102, 102, 102, 0.3);
}

#logoutBtn:hover {
  box-shadow: 0 15px 35px rgba(102, 102, 102, 0.4);
}

@media (max-width: 600px) {
  .main {
    margin: 20px auto;
    padding: 0 15px;
  }

  .page-title {
    font-size: 24px;
  }

  .position-card {
    padding: 20px;
    margin-bottom: 20px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    text-align: center;
  }

  .student-info {
    text-align: center;
  }

  .student-name {
    margin-bottom: 2px;
  }
}
</style>
</head>

<body>
<div class="header">
  <div class="logo">🗳️ College Elections</div>
  <div class="student-info">
    <span class="student-name" id="studentName">Welcome</span>
    <span id="studentAdm"></span>
  </div>
</div>

<div class="main">
  <h1 class="page-title">Cast Your Vote</h1>
  
  <div id="statusMsg"></div>

  <div id="positions"></div>

  <button id="submitVote">Submit Vote</button>
  <button id="logoutBtn">Logout</button>
</div>

<script type="module">
import { db } from "./js/firebase-config.js";
import {
  collection,
  getDocs,
  doc,
  getDoc,
  setDoc,
  addDoc,
  serverTimestamp,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

// Check if student is logged in
const student = JSON.parse(localStorage.getItem("currentStudent") || "{}");
if (!student || !student.admissionNo) {
  alert("Please login first");
  window.location.href = "student.html";
}

document.getElementById("studentName").textContent = student.name;
document.getElementById("studentAdm").textContent = `Admission: ${student.admissionNo}`;

const positionsDiv = document.getElementById("positions");
const statusMsg = document.getElementById("statusMsg");
let candidateData = {};
let votingEnabled = false;

// Listen to voting status
onSnapshot(doc(db, "system", "votingStatus"), (docSnap) => {
  if (docSnap.exists()) {
    votingEnabled = docSnap.data().enabled || false;
    if (!votingEnabled) {
      statusMsg.textContent = "❌ Voting is currently disabled by admin";
      statusMsg.className = "error show";
      document.getElementById("submitVote").disabled = true;
    } else {
      statusMsg.textContent = "";
      statusMsg.className = "";
      document.getElementById("submitVote").disabled = false;
    }
  }
});

// Load candidates
async function loadCandidates() {
  const snap = await getDocs(collection(db, "candidates"));
  candidateData = {};

  snap.forEach(docSnap => {
    const c = docSnap.data();
    if (!candidateData[c.position]) candidateData[c.position] = [];
    candidateData[c.position].push({ id: docSnap.id, ...c });
  });

  positionsDiv.innerHTML = "";

  for (const position in candidateData) {
    const card = document.createElement("div");
    card.className = "position-card";
    card.innerHTML = `<div class="position-title">${position}</div>`;

    candidateData[position].forEach(c => {
      const label = document.createElement("label");
      label.className = "candidate";
      label.innerHTML = `
        <input type="radio" name="${position}" value="${c.candidateId}">
        <div class="candidate-info">
          <div class="candidate-name">${c.name}</div>
          <div class="candidate-details">${c.email || ''}</div>
        </div>
      `;
      card.appendChild(label);
    });

    positionsDiv.appendChild(card);
  }
}

loadCandidates();

/* ========== SUBMIT VOTE - CORRECTED VERSION ========== */
document.getElementById("submitVote").onclick = async () => {
  const submitBtn = document.getElementById("submitVote");
  submitBtn.disabled = true;
  
  statusMsg.textContent = "⏳ Processing your vote...";
  statusMsg.className = "show";

  try {
    console.log("🎯 Starting vote submission for:", student.admissionNo);
    
    // Check voting status
    if (!votingEnabled) {
      throw new Error("Voting is currently disabled by admin");
    }

    // Check if student exists
    const studentRef = doc(db, "students", student.admissionNo);
    const studentSnap = await getDoc(studentRef);

    if (!studentSnap.exists()) {
      throw new Error("Student record not found. Contact admin.");
    }

    // Check if already voted
    if (studentSnap.data().hasVoted) {
      throw new Error("You have already voted!");
    }

    // Collect selected votes
    const selectedVotes = [];
    let hasSelection = false;
    
    document.querySelectorAll(".position-card").forEach(card => {
      const position = card.querySelector(".position-title").textContent;
      const checked = card.querySelector(`input[name="${position}"]:checked`);
      if (checked) {
        selectedVotes.push({
          position: position,
          candidateId: checked.value
        });
        hasSelection = true;
      }
    });

    if (!hasSelection) {
      throw new Error("Please select at least one candidate");
    }

    console.log("📋 Selected votes:", selectedVotes);

    // ✅ CRITICAL: Save each vote as a separate document for admin tracking
    const votePromises = [];
    
    for (const vote of selectedVotes) {
      console.log(`📝 Saving vote for position: ${vote.position}, candidate: ${vote.candidateId}`);
      
      // Create a unique vote document for each position
      const voteData = {
        admissionNo: student.admissionNo,
        studentId: student.admissionNo,
        candidateId: vote.candidateId,
        position: vote.position,
        timestamp: serverTimestamp()
      };
      
      console.log("📋 Vote data:", voteData);
      
      // Use addDoc to create unique document IDs
      votePromises.push(addDoc(collection(db, "votes"), voteData));
    }

    // Wait for all votes to be saved
    const savedVotes = await Promise.all(votePromises);
    console.log("✅ All votes saved! Document IDs:", savedVotes.map(v => v.id));

    // Verify votes were saved
    for (const voteRef of savedVotes) {
      const verifySnap = await getDoc(voteRef);
      console.log("✅ Vote verified - ID:", voteRef.id, "Data:", verifySnap.data());
    }

    // Mark student as voted
    await setDoc(studentRef, { 
      hasVoted: true,
      votedAt: serverTimestamp()
    }, { merge: true });

    console.log("✅ Student marked as voted");

    // Show success message
    statusMsg.textContent = "✅ Vote submitted successfully!";
    statusMsg.className = "success show";
    
    // Clear candidate list
    positionsDiv.innerHTML = "<p style='text-align:center; color:#4caf50; padding: 40px; font-size: 18px; font-weight: 600;'>✅ Your vote has been recorded successfully!</p>";
    
    // Show logout button
    document.getElementById("logoutBtn").style.display = "block";
    
    console.log("🎉 Vote submission complete!");

    // Optional: Auto-redirect after 3 seconds
    setTimeout(() => {
      localStorage.removeItem("currentStudent");
      window.location.href = "index.html";
    }, 3000);

  } catch (error) {
    console.error("❌ Vote submission error:", error);
    statusMsg.textContent = "❌ " + error.message;
    statusMsg.className = "error show";
    submitBtn.disabled = false;
  }
};

/* ========== LOGOUT BUTTON ========== */
document.getElementById("logoutBtn").onclick = () => {
  localStorage.removeItem("currentStudent");
  window.location.href = "index.html";
};
</script>
</body>
</html>
